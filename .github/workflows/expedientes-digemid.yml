name: "Expedientes DIGEMID - Estatus cada 3 dias"

# Corre en el runner self-hosted de la PC (IP residencial): Cloudflare de
# minsa.gob.pe bloquea las IPs de los servidores de GitHub (HTTP 403).

on:
  schedule:
    # 08:00 hora Lima = 13:00 UTC, cada 3 dias (igual que digemid-monitor)
    - cron: "0 13 */3 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (consulta pero no envia correo)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: expedientes-digemid
  cancel-in-progress: false

env:
  EMAIL_FROM: "conkosafe.ai@gmail.com"
  # Destinatarios: variable del repo EXPEDIENTES_EMAIL_TO (coma-separados).
  EMAIL_TO: ${{ vars.EXPEDIENTES_EMAIL_TO || 'conkosafe.ai@gmail.com' }}
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  estatus:
    name: "Consultar expedientes y enviar estatus"
    runs-on: [self-hosted, Windows, regulator]
    defaults:
      run:
        shell: powershell
    env:
      SHOTS_DIR: ${{ runner.temp }}\expedientes
      REPORT_PATH: ${{ runner.temp }}\expedientes\expedientes_reporte.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Playwright + Chromium (solo la primera vez tarda)
        run: |
          python --version
          python -m pip install --quiet --upgrade "playwright>=1.47"
          python -m playwright install chromium
          New-Item -ItemType Directory -Force -Path $env:SHOTS_DIR | Out-Null
          Remove-Item "$env:SHOTS_DIR\*" -Force -ErrorAction SilentlyContinue

      - name: Consultar expedientes en DIGEMID
        run: python scripts/expedientes/consulta_expediente.py

      - name: Guardar capturas y reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expedientes-${{ github.run_id }}
          path: ${{ runner.temp }}\expedientes\
          retention-days: 30
          if-no-files-found: ignore

      - name: Enviar correo de estatus
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/expedientes/send_status_email.py

      - name: Commit del ultimo estatus conocido
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/expedientes/estado.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Sin cambios de estatus."
          } else {
            git commit -m "chore(expedientes): estatus $(Get-Date -Format yyyy-MM-dd)"
            git pull --rebase
            git push
          }
          exit 0
